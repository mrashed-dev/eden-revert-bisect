name: eden-confirm-build

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base commit or branch"
        required: false
        default: "master"
      revert_sha:
        description: "Merge commit to revert (-m 1); empty = plain build"
        required: false
        default: ""
      label:
        description: "Artifact label"
        required: false
        default: "master-plain"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator --version | head -1

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clone eden, checkout base, optionally revert
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name "CI Bisect"
          git clone https://git.eden-emu.dev/eden-emu/eden.git eden
          cd eden
          git checkout "$BASE_REF"
          if [ -n "$REVERT" ]; then
            echo "Reverting merge commit $REVERT"
            git revert --no-edit -m 1 "$REVERT"
          fi
          git log --oneline -3
        env:
          BASE_REF: ${{ inputs.base_ref }}
          REVERT: ${{ inputs.revert_sha }}

      - name: Build APK (standard, Release)
        working-directory: eden
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          .ci/android/build.sh -b Release -t standard

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.label }}
          path: eden/artifacts/*.apk
          if-no-files-found: error
